name: Test

on: 
  push: 
    branches: 
      - main

jobs:
  test-python:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: install uv
        run: |
          pip install uv
          ls -all
          cd backend
          uv --version
          uv sync
          uv run pytest
      - name: pull on deployment server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{secrets.d_host}}
          username: ${{secrets.d_username}}
          key: ${{secrets.d_key}}
          script: |
            cd Thilak_Automation_Code/ciTest
            git pull origin main
            pip install uv
            cd backend
            uv run sync
            uv run fastapi run app/main.py