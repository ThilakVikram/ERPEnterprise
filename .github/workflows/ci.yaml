name: Test

on: 
  push: 
    branches: 
      - main

jobs:
  test-python:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: install uv
        run: |
          pip install uv
          uv --version
          uv sync
          uv run pytest