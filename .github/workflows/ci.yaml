name: Test

on: 
  push: 
    branches: 
      - main

jobs:
  test-python:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: install uv
        run: |
          pip install uv
          ls -all
          cd backend
          uv --version
          uv sync
          uv run pytest
      - name: pull on deployment server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{secrets.d_host}}
          username: ${{secrets.d_username}}
          key: ${{secrets.d_key}}
          script: |
            set -e
            APP_DIR="/home/ubuntu/Thilak_Automation_Code/ciTest/backend"
            UV="/home/ubuntu/.local/bin/uv"
            SERVICE="custom_fast_api.service"
            echo "Starting deployment..."
            cd /home/ubuntu/Thilak_Automation_Code/ciTest
            echo "Pulling latest code..."
            git pull origin main
            cd "$APP_DIR"
            echo "Syncing dependencies..."
            "$UV" sync --locked
            echo "Restarting FastAPI service..."
            sudo systemctl restart "$SERVICE"
            echo "Checking service status..."
            sudo systemctl is-active --quiet "$SERVICE"
            echo "Application is running properly!"
